services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 瀹瑰櫒榛樿浠?app 鐢ㄦ埛锛坲id 10001锛夎繍琛屻€傚涓绘満鎸傝浇鐩綍灞炰富涓嶅悓浼氬鑷?
    # 銆屽啓鍏?auths/*.json.tmp 澶辫触 permission denied銆嶏紝涓夌瑙ｆ硶浠婚€夛細
    #   1) 闈?root 路 璁╁鍣ㄤ互浣犺嚜宸辩殑 uid 杩愯锛堟寕杞界洰褰曟湰鏉ュ氨鏄綘寤虹殑锛夛細
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      鎴栧啓杩?.env 鏂囦欢锛歅UID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 浠?root 杩愯锛堢渷浜嬩絾瀹瑰櫒閫冮€搁潰鏇村ぇ锛岃嚜鎷咃級
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 娉ㄦ剰锛氬涓绘満蹇呴』鍏堟湁 config.json锛坈p config.example.json config.json锛夈€?
      # 缂哄け鏃?Docker 浼氭妸鎸傝浇鐐瑰垱寤烘垚鐩綍 鈫?瀹瑰櫒鍚姩澶辫触锛堢▼搴忎細鑷姩鐢熸垚閰嶇疆锛?
      # 浣嗗墠鎻愭槸瀹冭兘浠ユ枃浠跺舰寮忓啓鍏?鈥斺€?鎸傝浇鐩綍浼氭尅浣忚繖鏉¤矾寰勶級銆?
      # 涓嶆寕 :ro锛氶潰鏉裤€岄厤缃€嶉〉闇€瑕佸啓鍥炴鏂囦欢锛堜繚瀛樺悗鐑敓鏁堬級銆?
      - ./config.json:/app/config.json

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
